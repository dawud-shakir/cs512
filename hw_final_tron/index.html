<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a1c">
  <title>Pinball</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #020a1c; }
    body {
      font-family: system-ui, sans-serif; color: #dff6ff;
      touch-action: none; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    #hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
           font: 600 clamp(15px, 2.4vw, 22px) monospace; letter-spacing: 0.08em; text-transform: uppercase;
           white-space: pre-wrap; text-shadow: 0 0 4px #39c6ff, 0 0 14px #0a6cff; pointer-events: none; z-index: 2; }
    #cameraBtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 16px; z-index: 10;
                 padding: 7px 16px; font: 600 13px system-ui, sans-serif; color: #9fe6ff; cursor: pointer;
                 text-shadow: 0 0 6px #39c6ff;
                 background: rgba(2, 10, 26, 0.85); border: 1px solid rgba(80, 200, 255, 0.6); border-radius: 20px;
                 box-shadow: 0 0 10px rgba(40, 160, 255, 0.45), inset 0 0 8px rgba(40, 160, 255, 0.25); }

    #controls {
      position: fixed; left: 16px; right: 16px; bottom: 16px; margin: 0 auto; width: fit-content;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 28px;
      box-sizing: border-box;
      padding: 12px 22px; border-radius: 14px;
      background: rgba(2, 8, 22, 0.8); border: 1px solid rgba(80, 200, 255, 0.35);
      box-shadow: 0 0 18px rgba(20, 120, 255, 0.25), inset 0 0 12px rgba(20, 120, 255, 0.12);
    }
    .control { display: flex; align-items: center; gap: 6px; font-size: 16px; }
    .control span { margin: 0 4px; color: #a9d6f0; white-space: nowrap; }
    kbd {
      min-width: 1.4em; padding: 5px 10px; text-align: center;
      font: 600 17px monospace; color: #dff6ff;
      background: linear-gradient(#0c1a30, #06101f);
      border: 1px solid #2f7fb8; border-bottom-width: 3px; border-radius: 7px;
      box-shadow: 0 0 6px rgba(60, 180, 255, 0.35);
      transition: background 0.05s, border-color 0.05s, transform 0.05s, box-shadow 0.05s;
    }
    kbd.wide { min-width: 5em; }
    kbd.down { background: #39c6ff; border-color: #1a8fd6; color: #02060f; transform: translateY(2px);
               box-shadow: 0 0 14px #39c6ff, 0 0 28px #0a6cff; }

    #touch { display: none; position: fixed; inset: 0; z-index: 1; }
    body.touch #touch { display: block; }
    body.touch #controls { display: none; }
    .zone { position: absolute; top: 0; bottom: 0; width: 50%; touch-action: none; }
    #touchLeft { left: 0; }
    #touchRight { right: 0; }
    .pad, #touchLaunch {
      position: absolute; bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center;
      font: 700 20px system-ui, sans-serif; letter-spacing: 0.08em; color: #dff6ff;
      text-shadow: 0 0 6px #39c6ff;
      background: rgba(4, 14, 32, 0.55); border: 2px solid rgba(80, 200, 255, 0.55);
      box-shadow: 0 0 12px rgba(40, 160, 255, 0.35), inset 0 0 10px rgba(40, 160, 255, 0.2);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      transition: background 0.05s, transform 0.05s;
    }
    .pad { width: min(calc(50vw - 12px - 60px), 280px); height: clamp(96px, 14vh, 120px);
           border-radius: 20px; pointer-events: none; }
    #touchLeft .pad { left: calc(12px + env(safe-area-inset-left)); }
    #touchRight .pad { right: calc(12px + env(safe-area-inset-right)); }
    #touchLaunch {
      left: 50%; transform: translateX(-50%); z-index: 1;
      width: 104px; height: 104px; border-radius: 50%; padding: 0; font-size: 16px;
      touch-action: none; cursor: pointer;
    }
    .zone.down .pad, #touchLaunch.down { background: rgba(57, 198, 255, 0.85); color: #02060f;
                                         box-shadow: 0 0 18px #39c6ff, 0 0 36px #0a6cff; }
    .zone.down .pad { transform: scale(0.96); }
    #touchLaunch.down { transform: translateX(-50%) scale(0.94); }
  </style>
</head>

<body>
  <canvas id="glcanvas"></canvas>
  <div id="hud"></div>
  <button id="cameraBtn">🎥 Ball Cam (C)</button>

  <div id="controls">
    <div class="control"><kbd data-code="KeyZ">Z</kbd><kbd data-code="ArrowLeft">&larr;</kbd><span>Left flipper</span></div>
    <div class="control"><kbd class="wide" data-code="Space">Space</kbd><span>Hold to launch</span></div>
    <div class="control"><span>Right flipper</span><kbd data-code="Slash">/</kbd><kbd data-code="ArrowRight">&rarr;</kbd></div>
    <div class="control"><kbd data-code="KeyC">C</kbd><span>Camera</span></div>
    <div class="control"><kbd data-code="KeyW">W</kbd><kbd data-code="KeyA">A</kbd><kbd data-code="KeyS">S</kbd><kbd data-code="KeyD">D</kbd><span>Tilt</span></div>
    <div class="control"><kbd class="wide">Scroll</kbd><span>Zoom</span></div>
  </div>

  <div id="touch">
    <div class="zone" id="touchLeft"><div class="pad">&#9664; FLIP</div></div>
    <div class="zone" id="touchRight"><div class="pad">FLIP &#9654;</div></div>
    <button id="touchLaunch">LAUNCH</button>
  </div>

  <script src="transforms.js"></script>
  <script src="models.js"></script>
  <script src="physics.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>

</html>
